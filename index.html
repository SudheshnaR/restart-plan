<title>Restart · Daily Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F5F3FB; --card:#FFFFFF; --ink:#1D1735; --muted:#7B7692; --hair:#E9E6F2;
  --violet:#7C3AED; --emerald:#10B981;
  --grad:linear-gradient(135deg,#372E7C 0%,#7C3AED 55%,#A855F7 100%);
  --grad-today:linear-gradient(135deg,#FF5E7E,#FF9966);
  --grad-done:linear-gradient(135deg,#0EA5A0,#10B981);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#372E7C}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Outfit",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;
  max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px);
  min-height:100vh;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.02em}

/* ---------- hero ---------- */
.hero{background:var(--grad);border-radius:22px;padding:20px 18px;color:#fff;
  box-shadow:0 12px 30px rgba(72,42,180,.28)}
.hero-top{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:84px;height:84px;flex-shrink:0}
.ring-wrap svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.22);stroke-width:8}
#ringFill{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset .6s ease}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.75;font-weight:600}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px}
.hero-sub{font-size:12.5px;opacity:.8;margin-top:4px}
.hero-stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:600}
.legend{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;opacity:.9}
.leg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- today card ---------- */
.today{background:var(--card);border-radius:20px;margin-top:16px;padding:16px;
  box-shadow:0 8px 24px rgba(29,23,53,.08);border-top:5px solid var(--violet)}
.today-top{display:flex;align-items:center;gap:10px}
.chip{background:var(--grad-today);color:#fff;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.12em;padding:4px 10px;border-radius:999px}
.today-date{font-weight:700;font-size:13px;color:var(--muted)}
.today-wk{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
.today-task{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-top:10px}
.target{margin-top:8px;color:#4b4563;font-size:13.5px}
.t-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  font-weight:800;margin-right:6px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-open{flex:1;min-width:150px;text-align:center;background:var(--grad);color:#fff;
  text-decoration:none;font-weight:700;font-size:14px;padding:12px 14px;border-radius:14px;
  box-shadow:0 6px 16px rgba(124,58,237,.3)}
.btn-open:active{transform:scale(.98)}
.btn-done{flex-shrink:0;border:2px solid var(--violet);background:#fff;color:var(--violet);
  font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;cursor:pointer;font-family:inherit}
.btn-done.is-done{background:var(--grad-done);border-color:transparent;color:#fff;
  box-shadow:0 6px 16px rgba(16,185,129,.35)}
.btn-open.sm,.btn-done.sm{font-size:13px;padding:8px 12px;min-width:0;flex:none;border-radius:11px}
textarea.note{width:100%;margin-top:12px;border:1.5px solid var(--hair);background:var(--bg);
  padding:10px 12px;font:inherit;font-size:14px;border-radius:12px;resize:vertical;color:var(--ink)}
textarea.note:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:transparent}
.btn-done:focus-visible,.btn-open:focus-visible,.week-hdr:focus-visible,.day-row:focus-visible,
.stop:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
textarea.note.sm{font-size:13px;margin-top:10px}

/* ---------- phases ---------- */
.phase{margin-top:28px}
.phase-hdr{display:flex;align-items:center;gap:10px;padding:0 4px 10px}
.phase-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 4px var(--pd,transparent)}
.phase-name{font-weight:800;font-size:15px;letter-spacing:-.01em}
.phase-sub{font-size:12px;color:var(--muted)}
.phase-count{margin-left:auto;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}

/* ---------- weeks ---------- */
.week{background:var(--card);border-radius:16px;margin-bottom:10px;
  box-shadow:0 3px 12px rgba(29,23,53,.06);overflow:hidden}
.week-hdr{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:13px 14px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.week-no{font-weight:800;font-size:13px;width:36px;color:var(--wc,#7C3AED)}
.week-range{color:var(--muted);font-size:12px;font-weight:600}
.week-dots{margin-left:auto;display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hair);display:inline-block;transition:background .2s}
.caret{width:18px;text-align:center;color:var(--muted);font-weight:800;transition:transform .2s}
.week.open .caret{transform:rotate(45deg)}
.week-body{display:none;padding:2px 14px 12px}
.week.open .week-body{display:block}

/* ---------- days / journey line ---------- */
.days{list-style:none;border-left:3px solid var(--wc,#7C3AED);margin-left:13px;padding:4px 0}
.day{display:flex;gap:12px;position:relative;padding:8px 0}
.stop{width:17px;height:17px;border-radius:50%;background:var(--card);
  border:2.5px solid var(--hair);margin-left:-10px;margin-top:2px;flex-shrink:0;cursor:pointer;
  transition:transform .15s,background .2s,border-color .2s}
.stop:active{transform:scale(1.2)}
.stop.done{border-color:var(--wc);background:var(--wc)}
.stop.today-stop{border-color:#FF5E7E;box-shadow:0 0 0 4px rgba(255,94,126,.2)}
.day-body{flex:1;min-width:0}
.day-row{display:flex;gap:10px;align-items:baseline;width:100%;background:none;border:none;
  font:inherit;text-align:left;cursor:pointer;padding:0;color:var(--ink)}
.day-date{color:var(--muted);flex-shrink:0;width:74px;font-weight:600}
.day-task{font-size:13.5px;font-weight:600}
.struck{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.day.today-day .day-task{font-weight:800}
.detail{display:none;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:12px}
.day.open .detail{display:block}
.detail .target{margin-top:0;font-size:13px}

/* ---------- misc ---------- */
.break{margin:4px 0 12px;padding:12px 14px;background:#FFF4DE;color:#8a6a1f;border-radius:14px;
  font-size:12.5px;font-weight:600}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
.burst{position:fixed;pointer-events:none;z-index:99}
.burst i{position:absolute;width:9px;height:9px;border-radius:2px;
  animation:pop .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{
  0%{transform:translate(0,0) scale(1) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(220deg);opacity:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------------- state & storage ---------------- */
var ALL = [];
PLAN.forEach(function(wk){ wk.days.forEach(function(d){
  ALL.push({date:d[0],task:d[1],target:d[2],link:d[3],w:wk.w,p:wk.p});
});});
var TOTAL = ALL.length;
var KEY = "restart-daily-plan-v1";
var done = {}, notes = {};
var mem = {};
var saveTimer = null;

async function loadState(){
  try{
    if (window.storage){
      var r = await window.storage.get(KEY);
      if (r && r.value){ var v = JSON.parse(r.value); done = v.done||{}; notes = v.notes||{}; return; }
    }
  }catch(e){}
  try{
    var s = localStorage.getItem(KEY);
    if (s){ var v2 = JSON.parse(s); done = v2.done||{}; notes = v2.notes||{}; return; }
  }catch(e){}
  if (mem[KEY]){ var v3 = JSON.parse(mem[KEY]); done = v3.done||{}; notes = v3.notes||{}; }
}
async function saveState(){
  var payload = JSON.stringify({done:done, notes:notes});
  mem[KEY] = payload;
  try{ if (window.storage){ await window.storage.set(KEY, payload); return; } }catch(e){}
  try{ localStorage.setItem(KEY, payload); }catch(e){}
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 500); }

/* ---------------- helpers ---------------- */
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmt(ds){
  var p = ds.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return DOW[dt.getDay()] + " " + p[2] + "." + p[1];
}
function todayISO(){
  var n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
}
var TODAY = todayISO();
function focusDay(){
  for (var i=0;i<ALL.length;i++){ if (ALL[i].date === TODAY) return ALL[i]; }
  for (var j=0;j<ALL.length;j++){ if (ALL[j].date > TODAY) return ALL[j]; }
  return ALL[ALL.length-1];
}
function hexA(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function calcStreak(){
  var past = ALL.filter(function(d){ return d.date <= TODAY; });
  var i = past.length - 1;
  if (i >= 0 && past[i].date === TODAY && !done[TODAY]) i--;
  var s = 0;
  while (i >= 0 && done[past[i].date]){ s++; i--; }
  return s;
}

/* ---------------- render ---------------- */
var FOCUS = focusDay();

function renderLegend(){
  document.getElementById("legend").innerHTML = PHASES.map(function(ph){
    return '<span class="leg"><i style="background:' + ph.color + '"></i>' + ph.name + '</span>';
  }).join("");
}

function renderToday(){
  var f = FOCUS, ph = PHASES[f.p];
  var card = document.getElementById("todayCard");
  card.style.borderTopColor = ph.color;
  card.innerHTML =
    '<div class="today-top">' +
      '<span class="chip">' + (f.date === TODAY ? "Today" : "Next up") + '</span>' +
      '<span class="today-date mono">' + fmt(f.date) + '</span>' +
      '<span class="today-wk mono">Week ' + f.w + '</span>' +
    '</div>' +
    '<p class="today-task">' + f.task + '</p>' +
    '<p class="target"><span class="t-label">Target</span>' + f.target + '</p>' +
    '<div class="actions">' +
      '<a class="btn-open" href="' + f.link + '" target="_blank" rel="noreferrer">Open ' + SRC[f.link] + ' ↗</a>' +
      '<button class="btn-done" data-done-btn="' + f.date + '">Mark done</button>' +
    '</div>' +
    '<textarea class="note" rows="3" data-note="' + f.date + '" placeholder="Key points & notes for the day…"></textarea>';
}

function renderRoute(){
  var html = "";
  PHASES.forEach(function(ph, pi){
    html += '<section class="phase" style="--wc:' + ph.color + '">' +
      '<div class="phase-hdr">' +
        '<span class="phase-dot" style="background:' + ph.color + ';--pd:' + hexA(ph.color,.18) + '"></span>' +
        '<div><div class="phase-name">' + ph.name + '</div>' +
        '<div class="phase-sub">' + ph.sub + '</div></div>' +
        '<span class="phase-count" id="pc' + pi + '" style="background:' + hexA(ph.color,.14) + ';color:' + ph.color + '"></span>' +
      '</div>';
    PLAN.forEach(function(wk){
      if (wk.p !== pi) return;
      html += '<div class="week" id="wk' + wk.w + '" style="--wc:' + ph.color + '">' +
        '<button class="week-hdr" data-toggle-week="' + wk.w + '" aria-expanded="false">' +
          '<span class="week-no">W' + wk.w + '</span>' +
          '<span class="week-range mono">' + fmt(wk.days[0][0]) + ' – ' + fmt(wk.days[4][0]) + '</span>' +
          '<span class="week-dots">' + wk.days.map(function(d){
            return '<i class="dot" data-dot="' + d[0] + '"></i>';
          }).join("") + '</span>' +
          '<span class="caret">+</span>' +
        '</button>' +
        '<div class="week-body"><ol class="days">' +
        wk.days.map(function(d){
          var date = d[0];
          return '<li class="day' + (date === TODAY ? ' today-day' : '') + '" id="day-' + date + '">' +
            '<span class="stop' + (date === TODAY ? ' today-stop' : '') + '" data-stop="' + date + '" role="checkbox" aria-checked="false" tabindex="0"></span>' +
            '<div class="day-body">' +
              '<button class="day-row" data-row="' + date + '">' +
                '<span class="day-date mono">' + fmt(date) + '</span>' +
                '<span class="day-task" data-task="' + date + '">' + d[1] + '</span>' +
              '</button>' +
              '<div class="detail">' +
                '<p class="target"><span class="t-label">Target</span>' + d[2] + '</p>' +
                '<div class="actions">' +
                  '<a class="btn-open sm" href="' + d[3] + '" target="_blank" rel="noreferrer">' + SRC[d[3]] + ' ↗</a>' +
                  '<button class="btn-done sm" data-done-btn="' + date + '">Mark done</button>' +
                '</div>' +
                '<textarea class="note sm" rows="2" data-note="' + date + '" placeholder="Notes…"></textarea>' +
              '</div>' +
            '</div></li>';
        }).join("") +
        '</ol></div></div>';
      if (wk.w === 20){
        html += '<div class="break">✳ Holiday break · 21 Dec – 1 Jan · no tasks — rest ✨</div>';
      }
    });
    html += '</section>';
  });
  document.getElementById("route").innerHTML = html;
}

/* ---------------- UI updates ---------------- */
function updateDayUI(date){
  var isDone = !!done[date];
  document.querySelectorAll('[data-stop="' + date + '"]').forEach(function(el){
    el.classList.toggle("done", isDone);
    el.setAttribute("aria-checked", isDone ? "true" : "false");
  });
  document.querySelectorAll('[data-task="' + date + '"]').forEach(function(el){
    el.classList.toggle("struck", isDone);
  });
  document.querySelectorAll('[data-dot="' + date + '"]').forEach(function(el){
    var ph = null;
    for (var i=0;i<ALL.length;i++){ if (ALL[i].date === date){ ph = PHASES[ALL[i].p]; break; } }
    el.style.background = isDone && ph ? ph.color : "";
  });
  document.querySelectorAll('[data-done-btn="' + date + '"]').forEach(function(el){
    el.classList.toggle("is-done", isDone);
    el.textContent = isDone ? "✓ Done" : "Mark done";
  });
}
function updateStats(){
  var count = Object.keys(done).length;
  var pct = Math.round(count / TOTAL * 100);
  var C = 213.6;
  document.getElementById("ringFill").style.strokeDashoffset = C - (C * pct / 100);
  document.getElementById("pctText").textContent = pct + "%";
  document.getElementById("donePill").textContent = count + " of " + TOTAL + " done";
  var s = calcStreak();
  document.getElementById("streakPill").textContent = "🔥 " + s + "-day streak";
  PHASES.forEach(function(ph, pi){
    var days = ALL.filter(function(d){ return d.p === pi; });
    var dn = days.filter(function(d){ return done[d.date]; }).length;
    var el = document.getElementById("pc" + pi);
    if (el) el.textContent = dn + "/" + days.length;
  });
}
function syncNotes(date, sourceEl){
  document.querySelectorAll('[data-note="' + date + '"]').forEach(function(el){
    if (el !== sourceEl) el.value = notes[date] || "";
  });
}
function fillNotes(){
  document.querySelectorAll("[data-note]").forEach(function(el){
    el.value = notes[el.getAttribute("data-note")] || "";
  });
}
function burst(x, y){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cols = ["#FFD166","#FF5E7E","#7C3AED","#10B981","#3B82F6","#F59E0B"];
  var c = document.createElement("div");
  c.className = "burst"; c.style.left = x + "px"; c.style.top = y + "px";
  for (var i=0;i<16;i++){
    var s = document.createElement("i");
    s.style.background = cols[i % cols.length];
    s.style.setProperty("--dx", (Math.random()*170 - 85) + "px");
    s.style.setProperty("--dy", (-Math.random()*150 - 30) + "px");
    s.style.animationDelay = (Math.random()*80) + "ms";
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(function(){ c.remove(); }, 1000);
}
function toggleDone(date, evt){
  if (done[date]){ delete done[date]; }
  else {
    done[date] = true;
    if (evt){
      var t = evt.target.getBoundingClientRect();
      burst(t.left + t.width/2, t.top);
    }
  }
  updateDayUI(date);
  updateStats();
  saveState();
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(e){
  var wkBtn = e.target.closest("[data-toggle-week]");
  if (wkBtn){
    var wk = document.getElementById("wk" + wkBtn.getAttribute("data-toggle-week"));
    var open = wk.classList.toggle("open");
    wkBtn.setAttribute("aria-expanded", open ? "true" : "false");
    return;
  }
  var stop = e.target.closest("[data-stop]");
  if (stop){ toggleDone(stop.getAttribute("data-stop"), e); return; }
  var btn = e.target.closest("[data-done-btn]");
  if (btn){ toggleDone(btn.getAttribute("data-done-btn"), e); return; }
  var row = e.target.closest("[data-row]");
  if (row){ row.closest(".day").classList.toggle("open"); return; }
});
document.addEventListener("keydown", function(e){
  var stop = e.target.closest && e.target.closest("[data-stop]");
  if (stop && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    toggleDone(stop.getAttribute("data-stop"), e);
  }
});
document.addEventListener("input", function(e){
  var ta = e.target.closest && e.target.closest("[data-note]");
  if (ta){
    var date = ta.getAttribute("data-note");
    notes[date] = ta.value;
    syncNotes(date, ta);
    scheduleSave();
  }
});

/* ---------------- init ---------------- */
(async function(){
  renderLegend();
  renderToday();
  renderRoute();
  await loadState();
  ALL.forEach(function(d){ if (done[d.date]) updateDayUI(d.date); });
  fillNotes();
  updateStats();
  var wkEl = document.getElementById("wk" + FOCUS.w);
  if (wkEl){
    wkEl.classList.add("open");
    var hdr = wkEl.querySelector("[data-toggle-week]");
    if (hdr) hdr.setAttribute("aria-expanded","true");
  }
  var dayEl = document.getElementById("day-" + FOCUS.date);
  if (dayEl) dayEl.classList.add("open");
})();
</script>
